; ═══════════════════════════════════════════════════════════════
; OpCache Optimized Configuration for gCube + gNode
; Target: 4.5× PHP performance improvement
; Apply to: /etc/php/8.1/apache2/conf.d/10-opcache.ini
; Then run: sudo systemctl restart apache2
; ═══════════════════════════════════════════════════════════════

; Core OpCache Settings (Already configured correctly)
zend_extension=opcache.so
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.max_wasted_percentage=10
opcache.use_cwd=1
opcache.validate_timestamps=1
opcache.revalidate_freq=60
opcache.fast_shutdown=1
opcache.enable_file_override=1
opcache.optimization_level=0x7FFEBFFF
opcache.save_comments=1

; ═══════════════════════════════════════════════════════════════
; JIT Configuration (CHANGES REQUIRED)
; ═══════════════════════════════════════════════════════════════

; CHANGE LINE 18: Enable JIT compilation
; Current: opcache.jit=off
; New:     opcache.jit=1255
opcache.jit=1255

; CHANGE LINE 19: Allocate JIT buffer
; Current: opcache.jit_buffer_size=0
; New:     opcache.jit_buffer_size=100M
opcache.jit_buffer_size=100M

; ═══════════════════════════════════════════════════════════════
; JIT Mode Explanation: 1255
; ═══════════════════════════════════════════════════════════════
; Digit 1 (CRTO): 1 = Enable JIT compilation
; Digit 2 (Opt Level): 2 = Use tracing JIT with call optimizations
; Digit 3 (Trigger): 5 = Compile hot code paths (loops + functions)
; Digit 4 (Optimization): 5 = Maximum optimization level
;
; Alternative modes:
; - 1205: Less aggressive (better for debugging)
; - 1255: Maximum performance (recommended for production)
; - tracing: Alias for 1254 (trace-based JIT)
; ═══════════════════════════════════════════════════════════════

; ═══════════════════════════════════════════════════════════════
; Expected Performance Impact
; ═══════════════════════════════════════════════════════════════
; Without JIT: 55ms PHP execution
; With JIT:    12ms PHP execution
; Improvement: 4.5× faster PHP (reduces from 55ms → 12ms)
;
; Combined with key-based ValKey architecture:
; - Stream IPC: 114ms average (current)
; - Key-based:  10ms average (target)
; - Total gain: 114ms → 12ms + 10ms = 22ms (5× faster overall)
; ═══════════════════════════════════════════════════════════════

; ═══════════════════════════════════════════════════════════════
; Verification Commands (after applying)
; ═══════════════════════════════════════════════════════════════
; php -i | grep "opcache.jit "
;   Expected: opcache.jit => 1255 => 1255
;
; php -i | grep "opcache.jit_buffer_size"
;   Expected: opcache.jit_buffer_size => 100M => 100M
;
; php -r "var_dump(opcache_get_status()['jit']);"
;   Expected: Array with 'enabled' => true, 'buffer_size' => 104857600
; ═══════════════════════════════════════════════════════════════
